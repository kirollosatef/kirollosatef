<tspan class="eq" x="422.6" y="129">f(x)</tspan>
<tspan class="eq" x="26.6" y="155">χ = 2 − 2g</tspan>
<tspan class="eq" x="389.6" y="233">Σ 1/p = ∞</tspan>
<tspan class="eq" x="26.6" y="259">i² = −1</tspan>
<tspan class="eq" x="26.6" y="311">y&#x27; = f(x, y)</tspan>
<tspan class="eq" x="46.4" y="350">e ≈ 2.71828</tspan>
<tspan class="eq" x="26.6" y="376">Σ 1/n² = π²/6</tspan>
