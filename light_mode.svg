<tspan class="eq" x="422.6" y="147">f(x)</tspan>
<tspan class="eq" x="26.6" y="173">χ = 2 − 2g</tspan>
<tspan class="eq" x="389.6" y="251">Σ 1/p = ∞</tspan>
<tspan class="eq" x="26.6" y="277">i² = −1</tspan>
<tspan class="eq" x="26.6" y="329">y&#x27; = f(x, y)</tspan>
<tspan class="eq" x="46.4" y="368">e ≈ 2.71828</tspan>
<tspan class="eq" x="26.6" y="394">Σ 1/n² = π²/6</tspan>
