<text font-size="11px">
<tspan class="eq hero" x="38.8" y="43">e^(iπ) + 1 = 0</tspan>
<tspan class="eq" x="395.2" y="69">e = Σ 1/n!</tspan>
<tspan class="eq" x="38.8" y="95">γ ≈ 0.5772</tspan>
<tspan class="eq" x="434.8" y="134">f(x)</tspan>
<tspan class="eq" x="38.8" y="160">χ = 2 − 2g</tspan>
<tspan class="eq" x="401.8" y="238">Σ 1/p = ∞</tspan>
<tspan class="eq" x="38.8" y="264">i² = −1</tspan>
<tspan class="eq" x="38.8" y="316">y&#x27; = f(x, y)</tspan>
<tspan class="eq" x="58.6" y="355">e ≈ 2.71828</tspan>
<tspan class="eq" x="38.8" y="381">Σ 1/n² = π²/6</tspan>
<tspan class="eq" x="375.4" y="407">V − E + F = 2</tspan>
</text>
